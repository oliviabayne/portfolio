1:{title:"This World and Others Like It",course:"The Great Unprinted II",medium:"Editorial Design",year:"2026",description:"Ausstellungskatalog mit studentischen fotografischen Arbeiten, die im Rahmen der 9. Triennale der Photographie Hamburg entstanden sind. Entwicklung einer gemeinsamen Gestaltungslinie für den Katalog mit Anna Bachofner.",courseInfo:"",
pageText:"Bachelor- und Masterstudierende der Fakultät Design der HAW Hamburg präsentieren unter dem Titel „This World and Others Like It“ fotografische Arbeiten, die im Rahmen der 9. Triennale der Photographie Hamburg entstanden sind. Entwicklung einer Gestaltungslinie für den Katalog gemeinsam mit Anna Bachofner. Ziel war es, die unterschiedlichen fotografischen Positionen gestalterisch miteinander in Beziehung zu setzen und ihnen gleichzeitig genügend Raum für ihre jeweils eigene visuelle Sprache zu geben.<br><br>Der Katalog erschien anlässlich der gleichnamigen Ausstellung im Foyer der Fakultät Design der HAW Hamburg vom 11. Juni bis 3. Juli 2026.",
credits:"Herausgeber*innen: Prof. Linn Schröder, Prof. Vincent Kohlbecher, Prof. Stefan Stefanescu<br>Buchgestaltung: Olivia Bayne, Anna Bachofner<br>Fotografische Betreuung: Prof. Linn Schröder, Prof. Vincent Kohlbecher<br>Gestalterische Betreuung: Prof. Stefan Stefanescu<br>Druck: Heeneman Berlin; Druckwerkstätten der Fakultät Design<br>Papier: Metapaper Extra Smooth, 120 g/m²<br>Schriften: Inclusive Sans, Sligoil<br>Auflage: 100<br>Alle Bildrechte liegen bei den jeweiligen Fotograf*innen.",concept:"Bachelor- und Masterstudierende der Fakultät Design der HAW Hamburg präsentieren fotografische Arbeiten, die im Rahmen der 9. Triennale der Photographie Hamburg entstanden sind. Die Gestaltung des Katalogs entstand als Teamarbeit mit Anna Bachofner.",process:"Buchgestaltung: Olivia Bayne, Anna Bachofner<br>Herausgeber*innen: Prof. Linn Schröder, Prof. Vincent Kohlbecher, Prof. Stefan Stefanescu<br>Fotografische Betreuung: Prof. Linn Schröder, Prof. Vincent Kohlbecher<br>Gestalterische Betreuung: Prof. Stefan Stefanescu<br>Druck: Heeneman Berlin; Druckwerkstätten der Fakultät Design<br>Papier: Metapaper Extra Smooth, 120 g/m²<br>Schriften: Inclusive Sans, Sligoil<br>Auflage: 100<br>Alle Bildrechte liegen bei den jeweiligen Fotograf*innen.",coverImage:imagePath(1,1),previewImages:[imagePath(1,1),imagePath(1,2)],galleryImages:gallerySeries(1,100),images:["assets/project-1.svg","assets/project-1-detail.svg","assets/project-1-process.svg"]},
2:{title:"Common Sense",course:"Musikvideo goes Super 8 – Protest",medium:"Musikvideo · Super 8",year:"2026",description:"Konzept, Regie, Kamera & Schnitt eines auf Super 8 gedrehten Musikvideos zu der Musik von Bangerfabrique. Zentrale Themen sind weibliche Selbstermächtigung und die Repräsentation von Frauen in der Hip-Hop- und Graffiti-Kultur.",courseInfo:"Super 8 hat eine lange Geschichte als Medium des experimentellen und politischen Films. Die unmittelbare, analoge Ästhetik und die begrenzten Möglichkeiten des Materials machen den Film selbst zu einem Teil des gestalterischen Prozesses. Das Musikvideo greift diese Verbindung von Popkultur, Experimentalfilm und Protest auf.",
pageText:"Ein auf Super 8 gedrehtes Musikvideo zu der Musik von Bangerfabrique über weibliche Selbstermächtigung und die Repräsentation von Frauen in der Hip-Hop- und Graffiti-Kultur. Im Mittelpunkt stehen Selbstbestimmung, körperliche Freiheit und die Aneignung von Räumen, die häufig männlich konnotiert sind.<br><br>Ein Selbstverteidigungs-Schlüsselanhänger erscheint als wiederkehrendes Motiv: Er wird gemeinsam mit Graffitidosen eingepackt, an der Jeans getragen und zu Beginn und Ende als Stencil auf den Boden gesprüht. In einer weiteren Szene treten Füße auf ausgedruckte Songtexte von Tätern sexualisierter Gewalt. Auch die verwendete Gill Sans verweist über ihren Gestalter Eric Gill auf eine Geschichte sexuellen Missbrauchs. Teile der Choreografie greifen außerdem eine Bewegung aus One Billion Rising auf, einer internationalen Protestbewegung gegen Gewalt an Frauen und Mädchen. Protest wird so durch Gesten, Objekte und visuelle Codes in das Musikvideo eingeschrieben.",
credits:"Musik: Bangerfabrique<br>Konzept, Regie, Kamera & Schnitt: Olivia Bayne & Dilara Güney<br>Technik: Super 8; analog entwickelt im Labor der HAW Hamburg.",concept:"Das Video verbindet Musik, analogen Film und politische Referenzen. Wiederkehrende visuelle Codes thematisieren Selbstbestimmung, körperliche Freiheit und die Aneignung männlich konnotierter Räume. Ein Selbstverteidigungs-Schlüsselanhänger taucht als Objekt, Accessoire und Stencil auf; Teile der Choreografie greifen eine Bewegung aus One Billion Rising auf. Weitere Easter Eggs verweisen auf Macht, Täterschaft und sexualisierte Gewalt.",process:"Musik: Bangerfabrique<br>Konzept, Regie, Kamera & Schnitt: Olivia Bayne & Dilara Güney<br>Technik: Super 8; analog entwickelt im Labor der HAW Hamburg.",coverImage:imagePath(2,1),previewImages:[imagePath(2,1),imagePath(2,2)],galleryImages:gallerySeries(2,100),images:["assets/project-2.svg","assets/project-2-detail.svg","assets/project-2-process.svg"]},
3:{title:"Grenzen in Bewegung",course:"Form Follows Material",medium:"Posterobjekt · Experimentelle Typografie",year:"2026",description:"Ein haptisches Posterobjekt, das Grenze nicht als feste Linie, sondern als beweglichen Zustand begreift – als etwas, das sich verschiebt, dehnt, verhärtet oder auflöst.",courseInfo:"Typografie muss nicht auf einer glatten, zweidimensionalen Oberfläche stattfinden. Material kann Schrift formen, ihr Widerstand entgegensetzen und selbst zum Ausgangspunkt gestalterischer Entscheidungen werden. An der Schnittstelle von Typografie, Objekt und handwerklicher Praxis untersucht das Projekt, wie Schrift körperlich und räumlich erfahrbar werden kann.",
pageText:"„Grenzen in Bewegung“ begreift die Grenze nicht als feste Linie, sondern als Zustand: als etwas, das sich verschiebt, dehnt, verhärtet oder auflöst. Ausgangspunkt ist ein Gedanke aus Charlotte Rohdes „Hautpflege für unbändige Körper“: „Es braucht flüssige Grenzen, Bewegung, Raum für Ausdehnung in alle Richtungen.“<br><br>Mehrere textile Module sind äußerlich durch denselben Stoff verbunden, unterscheiden sich im Inneren jedoch grundlegend. Einige sind weich gepolstert und nachgiebig, andere enthalten ein starres Gitter, das Widerstand erzeugt und die Oberfläche von innen strukturiert. Weichheit und Härte werden dadurch nicht als sichtbare Gegensätze inszeniert, sondern körperlich erfahrbar. Die Grenze liegt nicht zwischen den Materialien, sondern innerhalb der einzelnen Körper. Auch die Typografie entsteht aus diesem Prinzip. 3D-gedruckte Buchstaben liegen unter dem Stoff und drücken sich von innen durch die textile Oberfläche. Schrift wird nicht appliziert, sondern wirkt als Volumen, Druck und Widerstand aus dem Inneren heraus.<br><br>Die Arbeit versteht Juxtaposition als gestalterische Praxis: Gegensätze müssen nicht aufgelöst werden; ihre Reibung kann selbst produktiv werden. „Grenzen in Bewegung“ sucht deshalb nicht nach einer eindeutigen Antwort, sondern nach einem Zustand, in dem Widersprüche sichtbar und spürbar bleiben.",
credits:"Maße: 80 × 118 cm<br>Gewicht: ca. 14 kg<br>Installation: lehnend / hängend an der Wand<br>Materialien: Stoff, Federstahldraht, PLA, Füllwatte; zur Stabilisierung Holz, Aluminiumdraht, Magnete, Tackernadeln und Druckknöpfe<br>Techniken: 3D-Druck, Maschinennaht, Maschinenstickerei<br>Schriften: Serif Babe Regular — Charlotte Rohde; Proxima Soft Extrabold — Mark Simonson",concept:"Mehrere textile Module sind äußerlich durch denselben Stoff verbunden, im Inneren jedoch gegensätzlich aufgebaut. Weiche Füllung trifft auf starre Gitterstrukturen; 3D-gedruckte Buchstaben liegen unter dem Stoff und drücken sich als Volumen und Widerstand durch die Oberfläche. Die Arbeit versteht Juxtaposition als Praxis: Gegensätze werden nicht aufgelöst, sondern in ihrer Reibung sichtbar und körperlich erfahrbar.",process:"Maße: 80 × 118 cm<br>Gewicht: ca. 14 kg<br>Installation: lehnend / hängend an der Wand<br><br>Materialien: Stoff, Federstahldraht, PLA, Füllwatte; zur Stabilisierung Holz, Aluminiumdraht, Magnete, Tackernadeln und Druckknöpfe<br>Techniken: 3D-Druck, Maschinennaht, Maschinenstickerei<br>Schriften: Serif Babe Regular — Charlotte Rohde; Proxima Soft Extrabold — Mark Simonson",coverImage:imagePath(3,1),previewImages:[imagePath(3,1),imagePath(3,2)],galleryImages:gallerySeries(3,100),images:["assets/project-3.svg","assets/project-3-detail.svg","assets/project-3-process.svg"]},
4:{title:"fotzig & politisch",course:"How to Argue with Paper",medium:"Editorial Design",year:"2026",description:"Eine gestalterische Auseinandersetzung mit der kontroversen Diskussion „F*tzig, bold, brat: Ist das der bessere Feminismus?“ aus dem Format 13 Fragen von unbubble/ZDFkultur.",courseInfo:"Editorial Design strukturiert Inhalte – kann aber auch Beziehungen, Widersprüche und Dynamiken sichtbar machen. Besonders bei einer Diskussion entsteht Bedeutung nicht nur durch das Gesagte, sondern auch durch Zustimmung, Ablehnung, Unterbrechungen, Annäherung und Distanz. Das Projekt untersucht, wie sich diese Dynamiken in die Gestaltung eines Buches übersetzen lassen.",
pageText:"„fotzig & politisch“ übersetzt die kontroverse Diskussion „F*tzig, bold, brat: Ist das der bessere Feminismus?“ aus dem Format 13 Fragen von unbubble/ZDFkultur in ein editorisches System. Im Video diskutieren zwei Gruppen aus unterschiedlichen Positionen heraus. Zustimmung und Widerspruch werden dabei auch räumlich sichtbar, indem sich die Teilnehmer*innen innerhalb eines Feldes aufeinander zu oder voneinander weg bewegen.<br><br>Das Buch überträgt diese Dramaturgie in das Layout. Stimmen, die sich inhaltlich annähern, rücken typografisch zusammen; gegensätzliche Positionen entfernen sich voneinander. Fallen sich Personen ins Wort, überlagern sich ihre Aussagen. Wortlose Bewegungen im Feld erscheinen als größere, transparent gesetzte Textebene im Hintergrund. Markierungen am Seitenrand zeigen, welchem Team die sprechende Person angehört, während die dreizehn Leitfragen durch monochrom eingefärbte Screenshots aus dem Video sichtbar werden.<br><br>Eine zusätzliche Ebene bilden Kommentare aus einem Reaktionsvideo von Silvi Carlsson. Sie befinden sich auf einem kleineren, unabhängig blätterbaren Format und können parallel zur Hauptdiskussion gelesen werden. Vier ergänzende Texte vertiefen Themen, die im Video nur angerissen werden, und sind auf schmalerem Papier eingebunden. Position, Nähe, Distanz, Unterbrechung und Widerspruch werden damit selbst zu typografischen Parametern.",
credits:"Texte und Quellen: unbubble / ZDFkultur; Silvi Carlsson; Björn Rohwer / SPIEGEL Kultur; Marie Serah Ebcinoglu / Missy Magazine; Katja Peglow / Missy Magazine; Henning von Bargen / Heinrich-Böll-Stiftung<br>Schriften: Inclusive Sans — Olivia King; Andale Mono — Steve Matteson; Sweet Fancy Script — Linnea Lundquist & Mark van Bronkhorst<br>Druck: SCHARLAU GmbH<br>Auflage: 2",concept:"Das Layout übersetzt die räumliche Dramaturgie der Diskussion in ein typografisches System: Zustimmung lässt Textpositionen zusammenrücken, Widerspruch vergrößert ihre Distanz. Fallen sich Personen ins Wort, überlagern sich Aussagen. Bewegungen im Diskussionsfeld erscheinen als transparente Textebene im Hintergrund; Markierungen am Seitenrand zeigen die Teamzugehörigkeit. Kommentare aus einem Reaktionsvideo liegen auf einem kleineren, separat blätterbaren Format, während vier ergänzende Texte auf schmalerem Papier Themen der Diskussion vertiefen.",process:"Quellen: unbubble/ZDFkultur; Silvi Carlsson; SPIEGEL Kultur / Björn Rohwer; Missy Magazine / Marie Serah Ebcinoglu und Katja Peglow; Heinrich-Böll-Stiftung / Henning von Bargen<br><br>Schriften: Inclusive Sans — Olivia King; Andale Mono — Steve Matteson; Sweet Fancy Script — Linnea Lundquist & Mark van Bronkhorst<br>Druck: SCHARLAU GmbH<br>Auflage: 2",coverImage:imagePath(4,1),previewImages:[imagePath(4,1),imagePath(4,2)],galleryImages:gallerySeries(4,100),images:["assets/project-4.svg","assets/project-4-detail.svg","assets/project-4-process.svg"]},
5:{title:"[DIS]PLAY THE SYSTEM",course:"[DIS]PLAY THE SYSTEM",medium:"Ausstellungsgestaltung",year:"2025",description:"[DIS]PLAY THE SYSTEM machte das von Prof. Heike Grebin initiierte Archiv Play the System mit fast 300 studentischen Arbeiten aus rund zwei Jahrzehnten als physische und interaktive Ausstellung erfahrbar.",courseInfo:"Play the System ist ein von Prof. Heike Grebin initiiertes Archiv mit fast 300 studentischen Arbeiten aus rund zwei Jahrzehnten an der HAW Hamburg. Im Mittelpunkt stehen regelbasierte und parametrische Ansätze im Grafikdesign sowie die Systeme, die gestalterischen Prozessen zugrunde liegen. Für die Ausstellung [DIS]PLAY THE SYSTEM wurde dieses digitale Archiv in einen physischen und interaktiven Raum übersetzt.",
pageText:"Die Ausstellung entstand als Gruppenprojekt unter Teamleitung von Katharina Wanke. Ich war unter anderem mit zuständig für die Details mit Plotterfolie und an Planung, Gestaltung und Umsetzung der Plotterfolien im Ausstellungsraum beteiligt. Darüber hinaus arbeitete ich an der Raumplanung mit.<br><br>Die Gestaltung verstand den Ausstellungsraum nicht nur als Behälter für die Arbeiten, sondern als physische Erweiterung des Archivs und seiner zugrunde liegenden Systeme.",
credits:"Teamleitung: Katharina Wanke<br>Archiv / Initiierung: Prof. Heike Grebin<br>Meine Aufgaben: Gestaltung und Produktion der Plotterfolien; Mitarbeit an der Raumplanung; Organisation der Buchpräsentation<br>Ausstellung: [DIS]PLAY THE SYSTEM — Kultur&Gut, Hamburg, 18.–20. Juli 2025",concept:"Das Archiv untersucht regelbasierte und parametrische Ansätze im Grafikdesign sowie die Systeme hinter gestalterischen Prozessen. Ich war Teil des Plot-Teams und an Planung, Gestaltung und Umsetzung der Plotterfolien beteiligt. Zusätzlich arbeitete ich an der Raumplanung mit und organisierte den zentralen Tisch für Bücher und weitere Archivarbeiten.",process:"Teamleitung: Katharina Wanke<br>Meine Aufgaben: Gestaltung und Produktion der Plotterfolien; Mitarbeit an der Raumplanung; Organisation der Buchpräsentation<br>Archiv / Initiierung: Prof. Heike Grebin<br>Ausstellung: Kultur&Gut, Hamburg, 18.–20.07.2025",coverImage:imagePath(5,1),previewImages:[imagePath(5,1),imagePath(5,2)],galleryImages:gallerySeries(5,100),images:["assets/project-5.svg","assets/project-5-detail.svg","assets/project-5-process.svg"]},
6:{title:"Charta Incognita",course:"Charta Incognita",medium:"Eine persönliche Karte Hamburgs aus feministischer Sicht",year:"2025",description:"Eine persönliche und feministische Kartierung Hamburgs, die nicht Straßen und Bezirke in den Mittelpunkt stellt, sondern Erfahrungen, Erinnerungen, Unsicherheiten und historische Spuren.",courseInfo:"Karten bilden Orte nicht nur ab, sondern entscheiden auch darüber, welche Geschichten, Erfahrungen und Perspektiven sichtbar werden. Charta Incognita nähert sich Hamburg deshalb nicht als objektiver Stadtplan, sondern aus einer persönlichen und feministischen Perspektive. Erinnerungen, Erfahrungen und Recherchen überlagern die geografische Struktur der Stadt und erzeugen eine subjektive Kartografie.",
pageText:"Mein Projekt ist eine persönliche und feministische Kartierung Hamburgs. Statt Straßen, Bezirke und geografische Orientierungspunkte in den Mittelpunkt zu stellen, untersucht die Arbeit, wie Erfahrungen, Erinnerungen, Unsicherheiten und historische Spuren eine individuelle Wahrnehmung von Stadt formen.<br><br>Alte Risomaster-Folien bilden eine nur noch schemenhaft erkennbare Grundlage des Hamburger Stadtplans. Darüber habe ich persönliche Erfahrungen nach Gefühl in Formen, Strukturen und Farben übersetzt und visuell interpretiert. Catcalling-Erlebnisse werden an den jeweiligen Orten verzeichnet, ebenso Femizide in Hamburg zwischen 2020 und 2025. Persönliche Erinnerung und gesellschaftliche Realität treffen dadurch innerhalb derselben Kartografie aufeinander.<br><br>Begleitend zur großformatigen Karte entstand ein experimentelles Buch als Recherche- und Prozessarchiv. Es enthält Risoexperimente, Collagen, Probekarten, Zeichnungen und Notizen aus einer alternativen Stadtführung zu sozialem Design und öffentlichen Räumen. Weitere Recherchen beschäftigen sich mit Hafenarbeiterinnen und ihrer systematischen Ausgrenzung trotz ihrer zentralen Rolle für den Hafen, mit der Seefrauenparade, der FrauenFreiluftGalerie sowie Fakten und Erfahrungen rund um Catcalling.<br><br>Die Arbeit versteht Kartografie nicht als objektive Darstellung eines Ortes, sondern fragt danach, wer eine Stadt beschreibt, welche Erfahrungen in ihren Karten sichtbar werden – und welche normalerweise fehlen.",
credits:"Medien: großformatige Karte, experimentelles Buch, Risografie, Zeichnung, Collage und Recherche",concept:"Aus alten Risomaster-Folien entstanden Linienabdrücke, die Hamburgs Stadtplan nur erahnen lassen. Darüber liegt eine zweite Ebene aus Formen, Strukturen, Farben und persönlichen Erfahrungen. Catcalling-Erlebnisse werden an ihren Orten verzeichnet, ebenso Femizide in Hamburg zwischen 2020 und 2025. Persönliche Erinnerung und gesellschaftliche Realität treffen so innerhalb derselben Kartografie aufeinander.",process:"Das begleitende Buch versammelt Risoexperimente, Collagen, Probekarten, Zeichnungen und Notizen. Recherchen beschäftigen sich unter anderem mit sozialem Design und öffentlichem Raum, Hafenarbeiterinnen und ihrer historischen Ausgrenzung, der Seefrauenparade, der FrauenFreiluftGalerie sowie Fakten und Erfahrungen rund um Catcalling.<br><br>Medien: großformatige Karte, experimentelles Buch, Risografie, Zeichnung, Collage und Recherche.",coverImage:imagePath(6,1),previewImages:[imagePath(6,1),imagePath(6,2)],galleryImages:gallerySeries(6,100),images:["assets/project-6.svg","assets/project-6-detail.svg","assets/project-6-process.svg"]}
};

function tryNextCoverExtension(img) {
  const extensions = ["JPG", "jpeg", "JPEG", "png", "PNG", "webp", "WEBP"];
  const current = Number(img.dataset.coverExtIndex || "0");
  if (current >= extensions.length) {
    img.onerror = null;
    return;
  }
  const base = img.dataset.coverBase;
  img.dataset.coverExtIndex = String(current + 1);
  img.src = `${base}.${extensions[current]}`;
}


function tryNextPreviewExtension(img) {
  const extensions = ["JPG", "jpeg", "JPEG", "png", "PNG", "webp", "WEBP"];
  const current = Number(img.dataset.previewExtIndex || "0");
  if (current >= extensions.length) {
    img.onerror = null;
    img.remove();
    return;
  }
  img.dataset.previewExtIndex = String(current + 1);
  img.src = `${img.dataset.previewBase}.${extensions[current]}`;
}

      <a class="page-close interactive" href="index.html#resume" aria-label="Zur Startseite">×</a>

        </div>

          <h1>About</h1>

          <p>Ein inhaltlicher Schwerpunkt meiner Arbeit liegt auf feministischen Themen. Mich interessiert, wie Gestaltung gesellschaftliche Strukturen, persönliche Erfahrungen und Fragen von Sichtbarkeit, Körper, Raum und Repräsentation verhandeln kann. Dabei arbeite ich gern sowohl recherchierend als auch persönlich und übersetze Inhalte in editorische, typografische oder räumliche Formen.</p>
          <p>Bevor ich Kommunikationsdesign studiert habe, habe ich eine Ausbildung zur Kauffrau für audiovisuelle Medien abgeschlossen. Danach ist der Wunsch geblieben, mich stärker gestalterisch weiterzuentwickeln und selbst visuell zu arbeiten – deshalb habe ich mich für das Studium entschieden.</p>

          </div>
        </div>
      </div>
    </article>
  `;
}


function galleryImageMarkup(projectId, number, title) {
  const base = `assets/project-${projectId}/${String(number).padStart(2, "0")}`;
  const exts = ["jpg","jpeg","png","webp","JPG","JPEG","PNG","WEBP"];
  return `<img src="${base}.${exts[0]}" data-base="${base}" data-exts='${JSON.stringify(exts.slice(1))}' alt="${title}, Bild ${number}" onerror="tryNextImageExtension(this)">`;
}
function tryNextImageExtension(img) {
  let exts=[]; try{exts=JSON.parse(img.dataset.exts||"[]")}catch(e){}
  if(!exts.length){img.remove();return;} const next=exts.shift(); img.dataset.exts=JSON.stringify(exts); img.src=`${img.dataset.base}.${next}`;
}

function setupWeightLens() {
  document.querySelectorAll(".lens-overlay,.lens-trail,.lens-ghost").forEach(el => el.remove());
  document.querySelectorAll(".lens-source").forEach(el => el.classList.remove("lens-source"));

  if (window.matchMedia("(pointer: coarse)").matches) return;

  const selector = [
    ".identity .name",
    ".identity .subtitle",
    ".project-nav .project-link span",
    ".project-label",
    ".preview-window h1",
    ".preview-window h2",
    ".preview-window h3",
    ".preview-window p",
    ".preview-window a",
    ".project-page h1",
    ".project-page h2",
    ".project-page h3",
    ".project-page p",
    ".project-page a",
    ".about-page h1",
    ".about-page h2",
    ".about-page h3",
    ".about-page p",
    ".about-page a"
  ].join(",");

  document.querySelectorAll(selector).forEach(el => {
    if (el.textContent.trim()) el.classList.add("lens-source");
  });
}

function updateWeightLens() {}

let lastTrailTime = 0;
let lensColorIndex = -1;
const lensColors = ["#c3a55c","#de4500","#6ea900","#53225c","#b8b8ff","#0057ba","#e62e73","#baa600","#ff7399"];

function leaveWeightTrail(x, y) {
  const now = performance.now();
  if (now - lastTrailTime < 55) return;
  lastTrailTime = now;

  const elements = document.elementsFromPoint(x, y);
  let source = null;
  for (const el of elements) {
    if (el.classList?.contains("lens-source")) { source = el; break; }
    const candidate = el.closest?.(".lens-source");
    if (candidate) { source = candidate; break; }
  }
  if (!source) return;

  const rect = source.getBoundingClientRect();
  const half = 12;
  const x1 = Math.max(rect.left, x - half);
  const x2 = Math.min(rect.right, x + half);
  const y1 = Math.max(rect.top, y - half);
  const y2 = Math.min(rect.bottom, y + half);
  if (x2 <= x1 || y2 <= y1) return;

  const cs = getComputedStyle(source);
  const ghost = source.cloneNode(true);
  ghost.classList.remove("lens-source");
  ghost.classList.add("lens-ghost");
  ghost.removeAttribute("id");

  lensColorIndex = (lensColorIndex + 1) % lensColors.length;

  Object.assign(ghost.style, {
    left: `${rect.left}px`,
    top: `${rect.top}px`,
    width: `${rect.width}px`,
    height: `${rect.height}px`,
    margin: "0",
    transform: "none",
    fontFamily: cs.fontFamily,
    fontSize: cs.fontSize,
    lineHeight: cs.lineHeight,
    letterSpacing: cs.letterSpacing,
    textAlign: cs.textAlign,
    textTransform: cs.textTransform,
    whiteSpace: cs.whiteSpace,
    paddingTop: cs.paddingTop,
    paddingRight: cs.paddingRight,
    paddingBottom: cs.paddingBottom,
    paddingLeft: cs.paddingLeft,
    boxSizing: cs.boxSizing,
    color: lensColors[lensColorIndex],
    clipPath: `inset(${y1 - rect.top}px ${rect.right - x2}px ${rect.bottom - y2}px ${x1 - rect.left}px)`
  });

  document.body.appendChild(ghost);
  requestAnimationFrame(() => ghost.classList.add("fade"));
  setTimeout(() => ghost.remove(), 3400);
}

function updateIdentityLink() {
  const link = document.getElementById("identityLink");
  if (!link) return;
  const params = new URLSearchParams(location.search);
  const onHome = !params.has("project") && !params.has("about");
  link.href = onHome ? "index.html?about=1" : "index.html#resume";
  link.setAttribute("aria-label", onHome ? "About Olivia Bayne" : "Zur Startseite");
}

function render() {
  updateIdentityLink();
  const params = new URLSearchParams(window.location.search);
  const id = params.get("project");
  const about = params.get("about");

  closePreview(false);

  if (about) {
    app.innerHTML = aboutTemplate();
    document.title = "About — Olivia Bayne";
    document.querySelectorAll(".project-link").forEach(link => link.classList.remove("is-active"));
    window.scrollTo(0, 0);
  } else if (id && projects[id]) {
    app.innerHTML = projectTemplate(id);
    document.title = `${projects[id].title} — Olivia Bayne`;
    document.querySelectorAll(".project-link").forEach(link => {
      link.classList.toggle("is-active", link.dataset.project === id);
    });
    window.scrollTo(0, 0);
  } else {
    app.innerHTML = homeTemplate();
    document.title = "Olivia Bayne — Kommunikationsdesign";
    document.querySelectorAll(".project-link").forEach(link => link.classList.remove("is-active"));
  }

  bindInteractions();
  setupWeightLens();
}

function bindInteractions() {
  document.querySelectorAll(".project-card").forEach(card => {
    card.addEventListener("click", event => {
      event.preventDefault();
      openPreview(card.dataset.preview, lastPointer.x, lastPointer.y);
    });
  });

  document.querySelectorAll(".project-link, .interactive").forEach(el => {
    el.addEventListener("mouseenter", () => cursor.classList.add("is-link"));
    el.addEventListener("mouseleave", () => cursor.classList.remove("is-link"));
  });
}

function openPreview(id, x, y) {
  const p = projects[id];
  activePreview = id;
  previewWindow.dataset.project = String(id);

  previewContent.innerHTML = `
    <h2 class="preview-title">${p.title}<br>${p.medium} · ${p.year}</h2>
    <div class="preview-images">
      ${(Number(id) === 3 || Number(id) === 6 ? p.previewImages.slice(0,1) : p.previewImages).map((src, i) => `<img src="${src}" data-preview-base="${src.replace(/\.[^.]+$/, '')}" data-preview-ext-index="0" alt="${p.title}, Vorschau ${i + 1}" onerror="tryNextPreviewExtension(this)">`).join("")}
    </div>
    <div class="preview-info">
      <p>${p.description}</p>
      ${String(id) === "1" ? "" : `<p>${p.courseInfo}</p>`}
      <p class="preview-hint"><span class="preview-hint-desktop">klick ins Fenster oder auf ↗</span><span class="preview-hint-mobile">klick ins Fenster</span></p>
    </div>
  `;

  positionPreview(x, y);
  previewWindow.classList.add("is-open");
  previewBackdrop.classList.add("is-open");
  previewWindow.setAttribute("aria-hidden", "false");
  previewBackdrop.setAttribute("aria-hidden", "false");
  setupWeightLens();
}

function positionPreview(x, y) {
  const width = Math.min(780, window.innerWidth * 0.78);
  const height = Math.min(700, window.innerHeight * 0.78);
  const margin = 14;

  let left = x - width / 2;
  let top = y - height / 2;

  left = Math.max(margin, Math.min(left, window.innerWidth - width - margin));
  top = Math.max(margin, Math.min(top, window.innerHeight - height - margin));

  previewWindow.style.width = `${width}px`;
  previewWindow.style.height = `${height}px`;
  previewWindow.style.left = `${left}px`;
  previewWindow.style.top = `${top}px`;
}

function closePreview(updateHistory = true) {
  activePreview = null;
  previewWindow.classList.remove("is-open");
  previewBackdrop.classList.remove("is-open");
  previewWindow.setAttribute("aria-hidden", "true");
  previewBackdrop.setAttribute("aria-hidden", "true");
}

function saveHomeScroll() {
  const params = new URLSearchParams(location.search);
  if (!params.has("project") && !params.has("about")) {
    sessionStorage.setItem("portfolioHomeScrollY", String(window.scrollY));
  }
}

function openActiveProject() {
  if (!activePreview) return;
  saveHomeScroll();
  window.location.href = `index.html?project=${activePreview}`;
}

previewClose.addEventListener("click", event => {
  event.stopPropagation();
  closePreview();
});

previewExpand.addEventListener("click", event => {
  event.stopPropagation();
  openActiveProject();
});

previewWindow.addEventListener("click", event => {
  if (event.target.closest("button")) return;
  openActiveProject();
});

previewBackdrop.addEventListener("click", () => closePreview());

document.addEventListener("mousemove", event => {
  lastPointer = { x: event.clientX, y: event.clientY };
  cursor.style.left = `${event.clientX}px`;
  cursor.style.top = `${event.clientY}px`;
  updateWeightLens(event.clientX, event.clientY);
  leaveWeightTrail(event.clientX, event.clientY);
});

document.addEventListener("mousedown", () => cursor.classList.add("is-down"));
document.addEventListener("mouseup", () => cursor.classList.remove("is-down"));

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closePreview();
});

window.addEventListener("popstate", render);
window.addEventListener("resize", () => {
  if (activePreview) positionPreview(lastPointer.x, lastPointer.y);
});

render();


document.addEventListener("click", event => {
  const projectLink = event.target.closest('a[href*="?project="]');
  if (projectLink) saveHomeScroll();
});

window.addEventListener("load", () => {
  const params = new URLSearchParams(location.search);
  if (!params.has("project") && location.hash === "#resume") {
    const y = Number(sessionStorage.getItem("portfolioHomeScrollY") || 0);
    requestAnimationFrame(() => window.scrollTo(0, y));
  }
});

document.addEventListener("click", event => {
  const aboutLink = event.target.closest('a[href*="?about="]');
  if (aboutLink) saveHomeScroll();
});

window.addEventListener("popstate", updateIdentityLink);


function openImageLightbox(src, alt = "Vergrößertes Prozessbild") {
  closeImageLightbox();
  const overlay = document.createElement("div");
  overlay.className = "image-lightbox";
  overlay.innerHTML = `
    <button class="image-lightbox-close interactive" type="button" aria-label="Bild schließen">×</button>
    <img src="${src}" alt="${alt}">
  `;
  document.body.appendChild(overlay);
}

function closeImageLightbox() {
  document.querySelector(".image-lightbox")?.remove();
}

document.addEventListener("click", event => {
  const thumb = event.target.closest("[data-lightbox]");
  if (thumb) {
    event.preventDefault();
    const img = thumb.querySelector("img");
    openImageLightbox(thumb.dataset.lightbox, img?.alt || "Vergrößertes Prozessbild");
    return;
  }
  if (event.target.closest(".image-lightbox-close") || event.target.classList.contains("image-lightbox")) {
    closeImageLightbox();
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeImageLightbox();
});

</script>
